<span
    class="action-play-button hover-scale"
    (click)="togglePlayButton()"
    (keydown.enter)="togglePlayButton()"
>
    @if (
        (this.mediaPlayerStateService.playingObs$ | async) &&
        (this.mediaPlayerStateService.currentTrackObs$ | async)?.fromPlaylist === trackListId
    ) {
        <mat-icon class="play pause" svgIcon="pause"></mat-icon>
    } @else {
        <mat-icon class="play" svgIcon="play"></mat-icon>
    }
</span>
