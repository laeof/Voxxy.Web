@if (!(isFollowed$ | async)) {
    <span class="common-button action-follow-button" (click)="follow()" (keydown)="follow()">{{
        'MANAGER.FOLLOW' | translate
    }}</span>
} @else {
    <span
        class="common-button action-follow-button"
        (click)="unfollow()"
        (keydown.enter)="unfollow()"
        >{{ 'MANAGER.UNFOLLOW' | translate }}</span
    >
}
