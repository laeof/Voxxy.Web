<div class="state-progress">
    <svg viewBox="0 0 100 100">
        <circle class="background" cx="50" cy="50" r="45" />

        <circle
            class="progress-next"
            cx="50"
            cy="50"
            r="45"
            [attr.stroke-dasharray]="circumference"
            [attr.stroke-dashoffset]="dashNextOffset"
        />

        <circle
            class="progress"
            cx="50"
            cy="50"
            r="45"
            [attr.stroke-dasharray]="circumference"
            [attr.stroke-dashoffset]="dashOffset"
        />
    </svg>

    <span class="label">
        <p class="score">{{ getPercentage() }}</p>
        %</span
    >
</div>
