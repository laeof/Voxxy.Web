<div
    class="dropzone"
    [class.dragging]="isDragging"
    [class.loading]="isLoading"
    (click)="openFileDialog()"
    (keydown.enter)="openFileDialog()"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
>
    <input
        #fileInput
        type="file"
        accept="audio/*"
        multiple
        hidden
        (change)="onInputChange($event)"
    />

    <div class="dropzone-content">
        <div class="icon-wrapper wrapped-icon-hover">
            <mat-icon svgIcon="upload"></mat-icon>
        </div>

        <div class="title titlecolor">{{ title | translate }}</div>
        <div class="subtitle subcolor">{{ subtitle | translate }}</div>
        <div class="formats subcolor">{{ fileFormats }}</div>
    </div>
</div>

@if (errorMessage) {
    <div class="error">
        {{ errorMessage }}
    </div>
}

@if (files.length) {
    <div class="files">
        @for (item of files; track item.objectUrl) {
            <div class="file-item">
                <div class="file-main">
                    <div class="file-icon">🎧</div>

                    <div class="file-info">
                        <div class="file-name">
                            {{ item.name }}
                        </div>

                        <div class="file-meta">
                            {{ item.durationText }} ·
                            {{ item.size / 1024 / 1024 | number: '1.1-1' }} MB
                        </div>
                    </div>
                </div>

                <button type="button" class="remove-button" (click)="removeFile(item, $event)">
                    ×
                </button>
            </div>
        }
    </div>
}
