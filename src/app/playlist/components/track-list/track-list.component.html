<div class="content-spacing-horizontal">
    <table mat-table [dataSource]="(dataSource$ | async) || []">
        <ng-container matColumnDef="Number">
            <th mat-header-cell *matHeaderCellDef>{{ 'TRACK_LIST.NUMBER' | translate }}</th>
            <td mat-cell *matCellDef="let element" class="play-button">
                <button (click)="togglePlayButton(element)">
                    @if(this.isPlaying$ | async) {
                    <mat-icon class="play" svgIcon="pause"></mat-icon>
                    } @else {
                    <mat-icon class="play" svgIcon="play"></mat-icon>

                    @if((this.selected$ | async) === element.id) {
                    <span class="number">
                        {{ ((dataSource$ | async) || []).indexOf(element) + 1 }}
                    </span>
                    } }
                </button>
            </td>
        </ng-container>

        <ng-container matColumnDef="Name">
            <th mat-header-cell *matHeaderCellDef>{{ 'TRACK_LIST.NAME' | translate }}</th>
            <td mat-cell *matCellDef="let element">
                <div class="song-details">
                    <div class="song-cover">
                        <img src="{{ element.imageUrl }}" alt="" class="song-img" />
                    </div>
                    <div class="song-info">
                        <span class="song-name">{{ element.name }}</span>
                        <span class="song-artist subcolor">{{ element.artist.name }}</span>
                    </div>
                </div>
            </td>
        </ng-container>

        <ng-container matColumnDef="Album">
            <th mat-header-cell *matHeaderCellDef>{{ 'TRACK_LIST.ALBUM' | translate }}</th>
            <td mat-cell *matCellDef="let element">{{ element.album.name }}</td>
        </ng-container>

        <ng-container matColumnDef="Duration">
            <th mat-header-cell *matHeaderCellDef>{{ 'TRACK_LIST.DURATION' | translate }}</th>
            <td mat-cell *matCellDef="let element">{{ element.duration | durationTranslate }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
</div>
