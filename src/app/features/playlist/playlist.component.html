@defer (when entity$ | async) {
<playlist-manager
    [style.--color]="(entity$ | async)?.primaryColor"
    [playlist]="entity$ | async"
></playlist-manager>
<playlist-track-list [playlistId]="(entity$ | async)!.id"></playlist-track-list>
}
@placeholder {
    <app-manager-skeleton></app-manager-skeleton>
    <app-track-list-skeleton></app-track-list-skeleton>
}
